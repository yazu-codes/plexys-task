version: '3.5'

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: always
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/htpasswd:/etc/nginx/htpasswd
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/custom.conf:/etc/nginx/conf.d/custom.conf:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro

  nginx-letsencrypt:
    image: nginxproxy/acme-companion:latest
    container_name: nginx-letsencrypt
    restart: always
    depends_on:
      - nginx-proxy
    volumes_from:
      - nginx-proxy:rw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-acme:/etc/acme.sh
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}

  db:
    image: postgres:15
    container_name: corteza-db-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corteza"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: corteza
      POSTGRES_PASSWORD: ${CORTEZA_DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: corteza
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - internal

  corteza-server:
    image: cortezaproject/corteza:${CORTEZA_VERSION:-2024.9}
    container_name: corteza-server-prod
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: postgres://corteza:${CORTEZA_DB_PASSWORD:-change-me-in-production}@db:5432/corteza?sslmode=disable
      DOMAIN: ${DOMAIN:-your-domain.com}
      HTTP_WEBAPP_ENABLED: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-to-random-30plus-characters}
      VIRTUAL_HOST: ${DOMAIN:-your-domain.com}
      LETSENCRYPT_HOST: ${DOMAIN:-your-domain.com}
    volumes:
      - corteza_data:/data
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy=true"

  corteza-init:
    image: cortezaproject/corteza:${CORTEZA_VERSION:-2024.9}
    container_name: corteza-init-prod
    depends_on:
      corteza-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_DSN: postgres://corteza:${CORTEZA_DB_PASSWORD:-change-me-in-production}@db:5432/corteza?sslmode=disable
    networks:
      - internal
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "=== Creating admin user ==="
        /corteza/bin/corteza-server users add "$${ADMIN_EMAIL}" --password "$${ADMIN_PASSWORD}" || echo "User may already exist, continuing..."
        echo "=== Assigning super-admin role ==="
        /corteza/bin/corteza-server roles useradd super-admin "$${ADMIN_EMAIL}" || echo "Role may already be assigned, continuing..."
        echo "=== Done ==="
        exit 0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plexys-backend-prod
    restart: always
    depends_on:
      - corteza-server
    environment:
      VIRTUAL_HOST: ${AUTH_PROXY_DOMAIN:-auth.your-domain.com}
      LETSENCRYPT_HOST: ${AUTH_PROXY_DOMAIN:-auth.your-domain.com}
      VIRTUAL_PORT: "8080"
    volumes:
      - ./backend/configs/config.yaml:/app/configs/config.yaml:ro
    networks:
      - proxy
      - internal
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy=true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: corteza-frontend-prod
    restart: always
    depends_on:
      - corteza-server
      - backend
    environment:
      VIRTUAL_HOST: ${FRONTEND_DOMAIN:-app.your-domain.com}
      LETSENCRYPT_HOST: ${FRONTEND_DOMAIN:-app.your-domain.com}
    volumes:
      - ./frontend/.env:/app/.env:ro
    networks:
      - proxy
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy=true"

volumes:
  dbdata:
  corteza_data:
  nginx-acme:

networks:
  internal:
    driver: bridge
  proxy:
    external: true