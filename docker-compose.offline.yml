version: '3.5'

services:
  db:
    image: postgres:15
    container_name: corteza-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corteza"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: corteza
      POSTGRES_PASSWORD: ${CORTEZA_DB_PASSWORD:-corteza}
      POSTGRES_DB: corteza
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - internal
    ports:
      - "5432:5432"

  corteza-server:
    image: cortezaproject/corteza:${CORTEZA_VERSION:-2024.9}
    container_name: corteza-server
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: postgres://corteza:${CORTEZA_DB_PASSWORD:-corteza}@db:5432/corteza?sslmode=disable
      DOMAIN: ${DOMAIN:-localhost:18080}
      HTTP_WEBAPP_ENABLED: "true"
    volumes:
      - corteza_data:/data
    networks:
      - internal
    ports:
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  corteza-init:
    image: cortezaproject/corteza:${CORTEZA_VERSION:-2024.9}
    container_name: corteza-init
    depends_on:
      corteza-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_DSN: postgres://corteza:${CORTEZA_DB_PASSWORD:-corteza}@db:5432/corteza?sslmode=disable
    networks:
      - internal
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "=== Creating admin user ==="
        /corteza/bin/corteza-server users add "$${ADMIN_EMAIL}" --password "$${ADMIN_PASSWORD}" || echo "User may already exist, continuing..."
        echo "=== Assigning super-admin role ==="
        /corteza/bin/corteza-server roles useradd super-admin "$${ADMIN_EMAIL}" || echo "Role may already be assigned, continuing..."
        echo "=== Done ==="
        exit 0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plexys-backend
    restart: always
    depends_on:
      - corteza-server
    volumes:
      - ./backend/configs/config.yaml:/app/configs/config.yaml:ro
    networks:
      - internal
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: corteza-frontend
    restart: always
    depends_on:
      - corteza-server
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/.env:/app/.env:ro
    networks:
      - internal
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  dbdata:
  corteza_data:

networks:
  internal:
    driver: bridge